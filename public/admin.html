<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Command Center — Admin</title><link rel="stylesheet" href="/style.css"></head><body class="admin"><header><h1>⚙️ Parent Admin</h1><div class="nav"><a href="/display.html">TV Display</a><button id="logout" class="secondary">Log out</button></div></header><main><section id="login" class="card"><h2>Parent sign in</h2><form id="loginForm"><input type="password" name="password" placeholder="Admin password" required><button>Sign in</button></form></section><div id="adminContent" class="grid hide"><section class="card"><h2>🎮 Gaming Bank</h2><div class="big" id="bank">—</div><div id="timer"></div><form id="startForm"><input name="minutes" type="number" min="1" max="600" value="30" required><button>Start gaming (minutes)</button></form><div class="controls"><button data-timer="pause">Pause</button><button data-timer="resume">Resume</button><button data-timer="extend" data-minutes="5">+5 min</button><button data-timer="extend" data-minutes="15">+15 min</button><button data-timer="stop" class="danger">Stop & return whole unused minutes</button><button data-timer="dismiss" class="secondary">Dismiss alarm</button></div><h3>Manual adjustment</h3><form id="adjustForm"><input name="delta" type="number" placeholder="+ or - minutes" required><input name="reason" placeholder="Reason" required><button>Apply</button></form></section><section class="card"><h2>✅ Approve Chores</h2><p class="muted small">Tap Complete to award minutes. Completed chores cannot be awarded twice for the same day.</p><div id="chores" class="tasks"></div></section><section class="card"><h2>➕ Custom Task</h2><form id="taskForm"><input name="name" placeholder="Task name" required><input name="minutes" type="number" min="0" max="600" placeholder="Minutes" required><select name="schedule"><option value="daily">Every day</option><option value="school">Monday–Thursday</option><option value="weekdays">Weekdays</option><option value="weekend">Weekends</option></select><button>Create task</button></form><div id="tasks"></div></section><section class="card"><h2>🏆 Streak Challenges</h2><div id="streak"></div><form id="streakForm"><input name="name" placeholder="Challenge name" required><select name="taskId" id="streakTask"></select><select name="schedule"><option value="school">Monday–Thursday</option><option value="weekdays">Weekdays</option><option value="daily">Every day</option></select><input name="bonus" type="number" min="1" max="600" placeholder="Bonus minutes" required><button>Create challenge</button></form></section><section class="card"><h2>🍽️ Meal Planner</h2><form id="mealForm"><input type="date" name="date" required><select name="slot"><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option><option value="snack">Snack</option></select><input name="text" placeholder="Meal" required><button>Save meal</button></form><div id="meals"></div></section><section class="card"><h2>🔔 Settings & History</h2><form id="settingsForm"><label>Alarm seconds <input name="alarmSeconds" type="number" min="1" max="120" value="15" required></label><button>Save</button></form><h3>Recent reward activity</h3><div id="ledger" class="small"></div></section></div><div id="message" role="status"></div></main><script src="/app.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Command Center — TV</title><link rel="stylesheet" href="/style.css?v=052"></head><body class="display"><header><div><h1 id="greeting">Good morning, family!</h1><span class="muted" id="date"></span></div><div id="headerWeather" class="header-weather" hidden></div><div class="nav"><span id="clock"></span></div></header><main><div id="alarm" class="alarm hide" role="alert">🔔 GAME TIME IS UP!</div><div class="grid"><section class="card wide calendar" data-widget="calendar"><h2 id="tvCalHeading">📅 Our Week</h2><p class="muted"><span id="announcement"></span></p><div id="week" class="week"></div></section><section class="card gaming" data-widget="gaming"><h2>🎮 Gaming Time</h2><div class="big" id="bank">—</div><div class="muted">Available game time</div><h3 id="timer">No gaming session running</h3><div id="warnings" class="tag"></div></section><section class="card chores" data-widget="chores"><h2>🌱 Today's Chores</h2><div id="chores" class="tasks"></div><progress class="progress" id="choreProgress" max="1" value="0" aria-label="Chore progress"></progress><div id="choreSummary" class="small"></div></section><section class="card meals" data-widget="meals"><h2>🍽️ Today's Meals</h2><div id="meals"></div></section><section class="card streak" data-widget="streak"><h2>🏆 Homework Streak</h2><div id="streak"></div></section><section class="card chores" data-widget="lists"><h2>🛒 Household Lists</h2><div id="tvLists"></div></section><section class="card" data-widget="weather"><h2>🌤️ Weather</h2><div id="tvWeather"></div></section></div><footer class="footer">Our family · A little progress every day ♡</footer></main><script src="/app.js?v=052"></script></body></html>
